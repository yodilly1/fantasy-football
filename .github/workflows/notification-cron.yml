name: League notification worker

on:
  workflow_dispatch:

jobs:
  process-notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Process due league emails
        env:
          CRON_SECRET: ${{ secrets.NOTIFICATION_CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "NOTIFICATION_CRON_SECRET is not configured; skipping notification worker."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "https://uiyxlvwkuhidylbenjzc.supabase.co/functions/v1/process-notification-jobs" \
            --data '{}'
